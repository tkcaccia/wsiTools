name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to update"
        required: true
        default: "desktop-v0.1.1"
      upload_release:
        description: "Upload built installers to the GitHub release"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  build:
    name: Build desktop app (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04
            label: linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/wsiToolsDesktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JavaScript dependencies
        working-directory: tools/wsiToolsDesktop
        run: npm ci

      - name: Build Tauri desktop app
        working-directory: tools/wsiToolsDesktop
        run: npm run build

      - name: Collect desktop installers
        shell: bash
        working-directory: tools/wsiToolsDesktop
        run: |
          set -euo pipefail
          mkdir -p ../../release-artifacts
          version="0.1.1"
          case "${{ runner.os }}" in
            macOS)
              cp src-tauri/target/release/bundle/dmg/*.dmg \
                "../../release-artifacts/wsiTools-Desktop_${version}_macos_${{ runner.arch }}.dmg"
              ;;
            Windows)
              exe="$(find src-tauri/target/release/bundle -type f -name '*.exe' | head -n 1)"
              cp "$exe" "../../release-artifacts/wsiTools-Desktop_${version}_windows_x64-setup.exe"
              ;;
            Linux)
              deb="$(find src-tauri/target/release/bundle -type f -name '*.deb' | head -n 1 || true)"
              rpm="$(find src-tauri/target/release/bundle -type f -name '*.rpm' | head -n 1 || true)"
              appimage="$(find src-tauri/target/release/bundle -type f -name '*.AppImage' | head -n 1 || true)"
              if [ -n "$deb" ]; then
                cp "$deb" "../../release-artifacts/wsiTools-Desktop_${version}_linux_amd64.deb"
              fi
              if [ -n "$rpm" ]; then
                cp "$rpm" "../../release-artifacts/wsiTools-Desktop_${version}_linux_x86_64.rpm"
              fi
              if [ -n "$appimage" ]; then
                cp "$appimage" "../../release-artifacts/wsiTools-Desktop_${version}_linux_x86_64.AppImage"
              fi
              ;;
          esac

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    name: Upload installers to release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || inputs.upload_release == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Write checksums
        run: |
          cd release-artifacts
          sha256sum wsiTools-Desktop_0.1.1_* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "wsiTools Desktop $RELEASE_TAG" \
              --notes "Desktop installers built from ${GITHUB_SHA}."

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
