on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: Tissue visualizer skill

permissions:
  contents: read

jobs:
  check:
    name: Check skill against wsiTools source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2

      - name: Check reviewed APIs
        run: python3 scripts/package_tissue_skill.py --check

      - name: Check skill scripts
        run: |
          Rscript -e 'parse(file="skills/wsi-tissue-visualizer/scripts/build_viewer.R")'
          Rscript -e 'parse(file="skills/wsi-tissue-visualizer/scripts/build_remote.R")'
          node --check skills/wsi-tissue-visualizer/assets/viewer.js
          node --check skills/wsi-tissue-visualizer/assets/remote.js
          python3 -m py_compile skills/wsi-tissue-visualizer/scripts/verify_bundle.py skills/wsi-tissue-visualizer/scripts/check_source.py skills/wsi-tissue-visualizer/scripts/qa_viewer.py scripts/package_tissue_skill.py
