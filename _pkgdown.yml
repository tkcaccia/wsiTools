url: https://tkcaccia.github.io/wsiTools/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2563eb"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

home:
  title: wsiTools
  description: >
    Memory-efficient R tools for whole-slide image access, tiled viewing,
    annotations, spatial omics overlays, CellPhenotyper projects, conversion,
    and reproducible pathology preprocessing.
  sidebar:
    structure: [links, license, community, citation, authors, dev]

development:
  mode: auto

