<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wsiTools Viewer</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080b12; color: #f8fafc; }
      * { box-sizing: border-box; }
      html, body, #viewerFrame { width: 100%; height: 100%; margin: 0; border: 0; }
      body { overflow: hidden; background: #080b12; }
      #viewerFrame { display: block; background: #080b12; }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: 32px;
        background: #080b12;
        color: #cbd5e1;
        text-align: center;
        z-index: 2;
      }
      #status strong { color: #f8fafc; font-size: 18px; }
      #status small { max-width: 720px; color: #94a3b8; line-height: 1.45; overflow-wrap: anywhere; }
      #status[hidden] { display: none; }
      .spinner { width: 24px; height: 24px; margin: 0 auto; border: 3px solid #334155; border-top-color: #5eead4; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
    </style>
  </head>
  <body>
    <div id="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <strong id="statusTitle">Opening the wsiTools viewer</strong>
      <small id="statusText">Connecting to the local R viewer server...</small>
    </div>
    <iframe id="viewerFrame" title="wsiTools viewer" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
    <script>
      const frame = document.getElementById("viewerFrame");
      const status = document.getElementById("status");
      const statusTitle = document.getElementById("statusTitle");
      const statusText = document.getElementById("statusText");
      const target = new URLSearchParams(window.location.search).get("url");

      function showError(title, detail) {
        status.hidden = false;
        statusTitle.textContent = title;
        statusText.textContent = detail;
        document.querySelector(".spinner")?.remove();
      }

      if (!target || !/^https?:\/\/(127\.0\.0\.1|localhost):\d+\//i.test(target)) {
        showError("Viewer URL is missing", "The desktop launcher did not provide a valid local R viewer URL. Open the launcher log and try again.");
      } else {
        frame.addEventListener("load", () => {
          window.setTimeout(() => { status.hidden = true; }, 80);
        }, { once: true });
        frame.addEventListener("error", () => {
          showError("The viewer page could not be loaded", `${target}\nCheck that R is still running and that Windows security software allows localhost connections.`);
        });
        frame.src = target;
        window.setTimeout(() => {
          if (!status.hidden) {
            statusText.textContent = "The R server is taking longer than expected. Check the launcher log; the viewer will remain here until the page responds.";
          }
        }, 8000);
      }
    </script>
  </body>
</html>
