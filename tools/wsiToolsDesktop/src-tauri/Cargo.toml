[package]
name = "wsitools-desktop"
version = "0.1.5"
description = "Desktop launcher for the wsiTools live viewer"
authors = ["wsiTools contributors"]
edition = "2021"

[features]
default = []
# Kept as a developer-only feature while the browser/OpenSeadragon viewer
# remains the single supported Desktop interface.
native-wgpu = ["dep:wgpu", "dep:pollster", "dep:ureq", "dep:winit", "dep:image", "dep:bytemuck", "dep:egui", "dep:egui-wgpu", "dep:egui-winit", "dep:earcutr", "dep:rfd", "dep:geo"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
pollster = { version = "0.4", optional = true }
# The native renderer only connects to the local httpuv `http://127.0.0.1`
# service. Disabling TLS avoids pulling a platform-specific crypto toolchain
# into every desktop renderer build.
ureq = { version = "2.12", default-features = false, features = ["json"], optional = true }
wgpu = { version = "24", optional = true }
winit = { version = "0.30", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
egui = { version = "0.31", optional = true }
egui-wgpu = { version = "0.31", optional = true }
egui-winit = { version = "0.31", optional = true }
earcutr = { version = "0.4", optional = true }
rfd = { version = "0.15", optional = true }
geo = { version = "0.29", optional = true }
